<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Etymology Mapper — where words came from</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header>
    <div class="brand">
      <h1>Etymology Mapper</h1>
      <p>Watch a word travel across the map to English</p>
    </div>
    <nav class="chips" id="chips" aria-label="Choose a word"></nav>
    <div class="controls">
      <button class="btn" id="replay" title="Replay the animation">↻ Replay</button>
      <button class="btn" id="theme" title="Toggle light / dark">◐</button>
    </div>
  </header>

  <div id="stage">
    <svg id="map" role="img" aria-label="Map showing the journey of a word's etymology"></svg>
    <div class="hint">hover a word for dates &amp; notes</div>
    <div id="caption"></div>
    <div id="tooltip"></div>
  </div>

  <script src="vendor/d3.v7.min.js"></script>
  <script src="vendor/topojson-client.min.js"></script>
  <script src="data/land-50m.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
